<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GorevTakip - Giriş</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css?v=2">
</head>
<body>
    <div id="toast-container"></div>
    <div class="split-layout">
        <div class="split-visual">
            <div class="split-visual-content">
                <i class="fa-solid fa-layer-group" style="font-size: 64px; color: var(--primary-color); margin-bottom: 24px; filter: drop-shadow(0 0 20px var(--primary-color));"></i>
                <h1 style="font-size: 48px; font-weight: 700; margin-bottom: 16px;">GorevTakip<span style="color: var(--primary-color);">.</span></h1>
                <p style="color: var(--text-muted); font-size: 18px;">İş akışınızı bir üst seviyeye taşıyın. Modern, hızlı ve güvenli görev yönetimi.</p>
            </div>
        </div>
        <div class="split-form">
            <h2 style="font-size: 28px; margin-bottom: 32px;">Giriş Yap</h2>
            
            <div class="form-floating">
                <input type="email" id="email" placeholder=" " required>
                <label>E-posta Adresi</label>
            </div>
            
            <div class="form-floating">
                <input type="password" id="password" placeholder=" " required>
                <label>Şifre</label>
            </div>
            
            <button id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
                Giriş Yap <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            <div style="margin-top: 32px; text-align: center;">
                <span style="color: var(--text-muted);">Hesabınız yok mu?</span>
                <a href="register.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none; margin-left: 8px;">Kayıt Ol</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
