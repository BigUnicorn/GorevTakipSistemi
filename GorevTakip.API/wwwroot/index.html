<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Takip Sistemi - Giriş</title>
    <!-- Modern Font ve İkonlar -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css?v=1">
</head>
<body>
    <!-- Toast Bildirim Konteyneri -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <div class="login-container">
        <!-- Logo/İkon Yeri -->
        <i class="fa-solid fa-list-check" style="font-size: 40px; color: var(--primary-color); margin-bottom: 15px;"></i>
        <h2>Sisteme Giriş</h2>
        
        <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="E-posta Adresiniz" required>
        </div>
        
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Şifreniz" required>
        </div>
        
        <button id="loginBtn">Giriş Yap</button>
        <a href="register.html" class="link-text">Hesabınız yok mu? Kayıt Olun</a>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
