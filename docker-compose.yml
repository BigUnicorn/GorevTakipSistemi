version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gorevtakip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: GorevTakipDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Verilerin kalıcı olması için volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GorevTakipDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: gorevtakip-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gorevtakip-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # ports bölümü kaldırıldı, artık nginx üzerinden erişilecek
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=GorevTakipDb;Username=postgres;Password=${DB_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379
      - Jwt__Key=${JWT_SECRET_KEY}

  frontend:
    build:
      context: ./gorev-takip-frontend
      dockerfile: Dockerfile
    container_name: gorevtakip-frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production

  proxy:
    image: nginx:alpine
    container_name: gorevtakip-proxy
    ports:
      - "5074:80" # Kullanıcı hala localhost:5074 üzerinden girecek
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data: