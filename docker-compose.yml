version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gorevtakip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: GorevTakipDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Verilerin kalıcı olması için volume

  redis:
    image: redis:alpine
    container_name: gorevtakip-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gorevtakip-api
    depends_on:
      - db
      - redis
    # ports bölümü kaldırıldı, artık nginx üzerinden erişilecek
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=GorevTakipDb;Username=postgres;Password=${DB_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379
      - Jwt__Key=${JWT_SECRET_KEY}

  frontend:
    build:
      context: ./gorev-takip-frontend
      dockerfile: Dockerfile
    container_name: gorevtakip-frontend
    depends_on:
      - api
    environment:
      - NODE_ENV=production

  proxy:
    image: nginx:alpine
    container_name: gorevtakip-proxy
    ports:
      - "5074:80" # Kullanıcı hala localhost:5074 üzerinden girecek
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend

volumes:
  postgres_data: