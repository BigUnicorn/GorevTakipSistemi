name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      # -warnaserror parametresi sayesinde uyarılar hata olarak kabul edilir ve build başarısız olur (Sıfır Hata politikası)
      run: dotnet build -c Release --no-restore -warnaserror
      
    - name: Test
      # Testcontainers kullandığımız için Ubuntu imajında varsayılan yüklü Docker deamon'u üzerinden PostgreSQL ve Redis ayağa kalkar
      run: dotnet test -c Release --no-build --verbosity normal

  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./gorev-takip-frontend
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: ./gorev-takip-frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint (ESLint)
      run: npm run lint
      
    - name: Type Check (TypeScript)
      run: npx tsc --noEmit
      
    - name: Unit Tests (Vitest)
      run: npm run test
      
    - name: Build (Next.js)
      run: npm run build
